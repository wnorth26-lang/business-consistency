name: Real-world consistency failure
description: Share a real case where systems of record disagreed
title: "[Use case]: "
labels: ["use-case", "market-signal"]
body:
  - type: input
    id: systems
    attributes: {label: "Which systems disagreed?", placeholder: "Stripe + product database"}
    validations: {required: true}
  - type: textarea
    id: invariant
    attributes: {label: "What should always have been true?"}
    validations: {required: true}
  - type: textarea
    id: observed
    attributes: {label: "What state did the systems actually report?"}
    validations: {required: true}
  - type: textarea
    id: discovery
    attributes: {label: "How did you discover the mismatch?"}
    validations: {required: true}
  - type: textarea
    id: impact
    attributes: {label: "What did it cost or affect?"}
  - type: textarea
    id: today
    attributes: {label: "How do you detect or prevent it today?"}
  - type: dropdown
    id: recurring
    attributes:
      label: "Has this class of problem happened more than once?"
      options: ["Yes", "No", "Not sure"]
    validations: {required: true}
